<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/supabase.js" defer></script>
  <script src="../js/auth.js" defer></script>
  <script src="../js/admin.js" defer></script>
</head>
<body>
  <div class="admin-container">
    <h1>Admin Dashboard</h1>
    <button id="logout">Logout</button>
    
    <div class="tabs">
      <button class="tab-btn active" data-tab="events">Events</button>
      <button class="tab-btn" data-tab="students">Students</button>
    </div>
    
    <div id="events-tab" class="tab-content active">
      <h2>Add New Event</h2>
      <form id="event-form">
        <input type="text" id="event-title" placeholder="Title" required>
        <input type="date" id="event-date" required>
        <input type="file" id="event-image" accept="image/*" required>
        <textarea id="event-desc" placeholder="Description" required></textarea>
        <button type="submit">Add Event</button>
      </form>
      
      <h2>All Events</h2>
      <div id="events-list"></div>
    </div>
    
    <div id="students-tab" class="tab-content">
      <h2>Add Student</h2>
      <form id="student-form">
        <input type="text" id="student-name" placeholder="Name" required>
        <input type="file" id="student-image" accept="image/*" required>
        <button type="submit">Add Student</button>
      </form>
      
      <h2>All Students</h2>
      <div id="students-list"></div>
    </div>
  </div>
</body>
</html>
